<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Path — Trajectory</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#070e1a;overflow:hidden;font-family:'Courier New',Courier,monospace}
body{display:flex;flex-direction:column;padding:10px;gap:8px}
.topbar{display:flex;align-items:center;gap:7px;flex-shrink:0;height:32px}
.sep{width:1px;height:18px;background:#1a2e47;flex-shrink:0;margin:0 2px}
.panel{display:none;flex:1;min-height:0;position:relative}
.panel.on{display:block}
.panel canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
.nv-tt{position:absolute;background:#0c1829;border:1px solid #1e3350;border-radius:5px;padding:5px 10px;font-size:11px;color:#8cb4d4;pointer-events:none;display:none;white-space:nowrap;z-index:10;font-family:'Courier New',monospace}
.tab{padding:4px 15px;border-radius:5px;border:1px solid #1a2e47;background:transparent;color:#3d5a7a;cursor:pointer;font-size:12px;letter-spacing:.06em;font-family:'Courier New',monospace;transition:all .15s}
.tab.on{background:rgba(34,211,238,.07);color:#22d3ee;border-color:#22d3ee}
.tab:hover:not(.on){border-color:#243d59;color:#5a7a9a}
.ctrl{display:flex;align-items:center;gap:5px;padding:3px 10px;border-radius:5px;border:1px solid;background:transparent;cursor:pointer;font-size:11px;letter-spacing:.03em;font-family:'Courier New',monospace;transition:opacity .15s}
.ctrl.off{opacity:.28}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.replay{margin-left:auto;display:flex;align-items:center;gap:5px;padding:4px 12px;border-radius:5px;border:1px solid #164e63;background:transparent;color:#22d3ee;cursor:pointer;font-size:11px;font-family:'Courier New',monospace;letter-spacing:.04em;transition:background .15s}
.replay:hover{background:rgba(34,211,238,.08)}
</style>
</head>
<body>

<div class="topbar">
  <button class="tab on" data-p="circle">○ Circle Path</button>
  <button class="tab" data-p="straight">— Straight Path</button>
  <div class="sep"></div>
  <button class="ctrl" id="bt-trials" style="color:#64748b;border-color:#1e2d3d"><span class="dot" style="background:#64748b"></span>Trials</button>
  <button class="ctrl" id="bt-ell"    style="color:#f87171;border-color:#7f1d1d"><span class="dot" style="background:#f87171"></span>2σ Ellipses</button>
  <button class="ctrl" id="bt-lbl"    style="color:#22d3ee;border-color:#164e63"><span class="dot" style="background:#22d3ee"></span>Labels</button>
  <button class="ctrl" id="bt-mean"   style="color:#f87171;border-color:#7f1d1d"><span class="dot" style="background:#f87171"></span>Mean</button>
  <button class="replay" id="btn-replay">&#9654; Replay</button>
</div>

<div class="panel on" id="pnl-circle"><canvas id="tc" aria-hidden="true"></canvas><div class="nv-tt" id="tt-c"></div></div>
<div class="panel"    id="pnl-straight"><canvas id="ts" aria-hidden="true"></canvas><div class="nv-tt" id="tt-s"></div></div>

<script>
const D={
  circle:{nw:11,
    xi:[0,-9.789,-13.528,-9.789,0,12.1,21.889,25.628,21.889,12.1,0],
    yi:[0,7.112,18.62,30.128,37.24,37.24,30.128,18.62,7.112,0,0],
    ex:[[0,-2,-2.5,-1.5,-2.5,-1.5,-0.5,2,4.5,5.5,5.5],[0,-2,-4,-3,-3.5,-2.5,-0.5,3.5,6.5,7,6],[0,-2,-3.5,-2.5,-2.5,-1.5,0,3,5,5.5,7]],
    ey:[[0,1.5,2.5,6,6,7,8,8,7.5,5.5,2],[0,1.5,4.5,7,8,10,11,10,8.5,6.5,1.5],[0,1,4.5,7,7,9,9,9,8.5,6.5,2.5]]},
  straight:{nw:10,
    xi:[0,11.508,23.016,34.523,46.031,57.539,69.047,80.554,92.062,103.57],
    yi:[0,3.739,0,3.739,0,3.739,0,3.739,0,3.739],
    ex:[[0,1.5,4,5.5,5.5,7,9,6.5,10.5,9.5],[0,1,3.5,4,5,5.5,5.5,5.5,9,9],[0,1,3.5,4,4.5,5.5,6,6,7,8]],
    ey:[[0,0.5,0,1.5,0.5,3,5,8.5,12.5,16.5],[0,0,0,1.5,3,6.5,8.5,11,12.5,13.5],[0,0.5,0.5,1,1,3,3.5,5,7.5,10]]}
};
const COL={trial:'#3d4f62',mean:'#f87171',ideal:'#c8d8e8',bg:'#070e1a',axl:'#8ab8d0',grid:'rgba(148,163,184,.22)',bd:'#2a4a6e'};
const DSH=[[],[6,3],[10,3,3,3]];
const MRK=['circle','rect','triangle'];
const ST={trials:true,ell:true,lbl:true,mean:true};
const ANIMS={};
const CACHE={};

const avg=a=>a.reduce((s,v)=>s+v,0)/a.length;
const cl=(v,lo=0,hi=1)=>Math.max(lo,Math.min(hi,v));
const ease=t=>t<.5?2*t*t:-1+(4-2*t)*t;

function cov2(xs,ys){
  const n=xs.length,mx=avg(xs),my=avg(ys);let a=0,b=0,c=0;
  for(let i=0;i<n;i++){a+=(xs[i]-mx)**2;b+=(xs[i]-mx)*(ys[i]-my);c+=(ys[i]-my)**2;}
  const d=n>1?n-1:1;return[a/d,b/d,c/d];
}
function ellPts(mux,muy,[a,b,c],ns=2,np=80){
  const tr=a+c,disc=Math.sqrt(Math.max(0,(a-c)**2/4+b*b));
  const l1=tr/2+disc,l2=tr/2-disc;
  const r1=ns*Math.sqrt(Math.max(0,l1)),r2=ns*Math.sqrt(Math.max(0,l2));
  let v1x=1,v1y=0;
  if(Math.abs(b)>1e-10){const ln=Math.sqrt(b**2+(l1-a)**2);v1x=b/ln;v1y=(l1-a)/ln;}
  const v2x=-v1y,v2y=v1x;
  return Array.from({length:np},(_,i)=>{const t=2*Math.PI*i/np;
    return[mux+v1x*r1*Math.cos(t)+v2x*r2*Math.sin(t),muy+v1y*r1*Math.cos(t)+v2y*r2*Math.sin(t)];});
}
function getCache(key){
  if(CACHE[key])return CACHE[key];
  const pd=D[key];const{xi,yi,ex,ey,nw}=pd;
  const xr=ex.map((r,_)=>r.map((e,j)=>xi[j]+e));
  const yr=ey.map((r,_)=>r.map((e,j)=>yi[j]+e));
  const mex=xi.map((_,j)=>avg(ex.map(r=>r[j])));
  const mey=xi.map((_,j)=>avg(ey.map(r=>r[j])));
  const xm=xi.map((x,i)=>x+mex[i]),ym=yi.map((y,i)=>y+mey[i]);
  const ells=Array.from({length:nw},(_,i)=>{
    const exi=ex.map(r=>r[i]),eyi=ey.map(r=>r[i]);
    return ellPts(xi[i]+avg(exi),yi[i]+avg(eyi),cov2(exi,eyi));
  });
  const allX=[...xi,...xr.flat(),...xm,...ells.flat().map(p=>p[0])];
  const allY=[...yi,...yr.flat(),...ym,...ells.flat().map(p=>p[1])];
  CACHE[key]={xi,yi,ex,ey,nw,xr,yr,xm,ym,ells,
    ax0:Math.min(...allX),ax1:Math.max(...allX),ay0:Math.min(...allY),ay1:Math.max(...allY)};
  return CACHE[key];
}
function makeTF(x0,x1,y0,y1,cw,ch,pad,eq){
  const dw=cw-2*pad,dh=ch-2*pad,xR=x1-x0,yR=y1-y0;
  if(eq){const sc=Math.min(dw/xR,dh/yR),ox=pad+(dw-xR*sc)/2,oy=pad+(dh-yR*sc)/2;
    return{x:dx=>ox+(dx-x0)*sc,y:dy=>ch-oy-(dy-y0)*sc,dx:cx=>(cx-ox)/sc+x0,dy:cy=>(ch-oy-cy)/sc+y0};}
  const sx=dw/xR,sy=dh/yR;
  return{x:dx=>pad+(dx-x0)*sx,y:dy=>ch-pad-(dy-y0)*sy,dx:cx=>(cx-pad)/sx+x0,dy:cy=>(ch-pad-cy)/sy+y0};
}
function niceTk(range,n){
  const r=range/n,p=Math.pow(10,Math.floor(Math.log10(Math.max(r,1e-9)))),nr=r/p;
  return(nr<1.5?1:nr<3.5?2:nr<7.5?5:10)*p;
}
function drawGrid(ctx,tf,x0,x1,y0,y1,cw,ch,pad,fs){
  ctx.save();ctx.beginPath();ctx.rect(pad,pad,cw-2*pad,ch-2*pad);ctx.clip();
  ctx.strokeStyle=COL.grid;ctx.lineWidth=.5;
  const xs=niceTk(x1-x0,6),xs0=Math.ceil(x0/xs)*xs;
  for(let x=xs0;x<=x1+.001;x+=xs){ctx.beginPath();ctx.moveTo(tf.x(x),pad);ctx.lineTo(tf.x(x),ch-pad);ctx.stroke();}
  const ys=niceTk(y1-y0,6),ys0=Math.ceil(y0/ys)*ys;
  for(let y=ys0;y<=y1+.001;y+=ys){ctx.beginPath();ctx.moveTo(pad,tf.y(y));ctx.lineTo(cw-pad,tf.y(y));ctx.stroke();}
  ctx.restore();
  ctx.fillStyle=COL.axl;ctx.font=`${fs}px 'Courier New',monospace`;
  ctx.textAlign='center';for(let x=xs0;x<=x1+.001;x+=xs)ctx.fillText(x.toFixed(0),tf.x(x),ch-pad+fs+2);
  ctx.textAlign='right';for(let y=ys0;y<=y1+.001;y+=ys)ctx.fillText(y.toFixed(0),pad-4,tf.y(y)+3);
  ctx.strokeStyle=COL.bd;ctx.lineWidth=1;ctx.strokeRect(pad,pad,cw-2*pad,ch-2*pad);
  ctx.fillStyle='#5a8aaa';ctx.textAlign='center';
  ctx.fillText('X Position (cm)',cw/2,ch-2);
  ctx.save();ctx.translate(fs+1,ch/2);ctx.rotate(-Math.PI/2);ctx.fillText('Y Position (cm)',0,0);ctx.restore();
}
function drawLinePct(ctx,tf,xs,ys,color,dash,lw,pct){
  if(pct<=0)return;
  const n=xs.length,pos=pct*(n-1),full=Math.floor(pos),frac=pos-full;
  ctx.save();ctx.strokeStyle=color;ctx.setLineDash(dash);ctx.lineWidth=lw;
  ctx.beginPath();ctx.moveTo(tf.x(xs[0]),tf.y(ys[0]));
  for(let i=1;i<=full&&i<n;i++)ctx.lineTo(tf.x(xs[i]),tf.y(ys[i]));
  if(full<n-1&&frac>0)ctx.lineTo(tf.x(xs[full]+frac*(xs[full+1]-xs[full])),tf.y(ys[full]+frac*(ys[full+1]-ys[full])));
  ctx.stroke();ctx.restore();
}
function drawMk(ctx,tf,x,y,color,shape,r){
  const cx=tf?tf.x(x):x,cy=tf?tf.y(y):y;
  ctx.save();ctx.fillStyle=color;
  if(shape==='circle'){ctx.beginPath();ctx.arc(cx,cy,r,0,6.28);ctx.fill();}
  else if(shape==='rect')ctx.fillRect(cx-r,cy-r,r*2,r*2);
  else{ctx.beginPath();ctx.moveTo(cx,cy-r);ctx.lineTo(cx+r,cy+r);ctx.lineTo(cx-r,cy+r);ctx.closePath();ctx.fill();}
  ctx.restore();
}
function drawMksPct(ctx,tf,xs,ys,color,shape,r,pct){
  const n=xs.length,pos=pct*(n-1);
  for(let i=0;i<=Math.min(Math.floor(pos),n-1);i++)drawMk(ctx,tf,xs[i],ys[i],color,shape,r);
}
function drawEllAlpha(ctx,tf,pts,alpha){
  if(alpha<=0)return;
  ctx.save();ctx.fillStyle=`rgba(248,113,113,${.12*alpha})`;ctx.strokeStyle=`rgba(248,113,113,${.6*alpha})`;ctx.lineWidth=.8;
  ctx.beginPath();ctx.moveTo(tf.x(pts[0][0]),tf.y(pts[0][1]));
  pts.forEach(p=>ctx.lineTo(tf.x(p[0]),tf.y(p[1])));
  ctx.closePath();ctx.fill();ctx.stroke();ctx.restore();
}
function wpOff(xs,ys,i,sc){
  if(i===0)return[-13,-13];if(i===xs.length-1)return[13,-13];
  const mx=avg(xs.slice(1,xs.length-1)),my=avg(ys.slice(1,ys.length-1));
  const dx=xs[i]-mx,dy=ys[i]-my,d=Math.sqrt(dx*dx+dy*dy)||1;
  return[dx/d*sc,-dy/d*sc];
}
function drawLblAlpha(ctx,tf,x,y,lbl,bg,bd,fg,ox,oy,alpha){
  if(alpha<=0)return;
  const cx=tf.x(x)+ox,cy=tf.y(y)+oy;
  ctx.save();ctx.globalAlpha=alpha;
  const sc=.45+.55*alpha;ctx.translate(cx,cy);ctx.scale(sc,sc);ctx.translate(-cx,-cy);
  ctx.fillStyle=bg;ctx.strokeStyle=bd;ctx.lineWidth=.8;
  ctx.beginPath();ctx.arc(cx,cy,9,0,6.28);ctx.fill();ctx.stroke();
  ctx.fillStyle=fg;ctx.font="bold 9px 'Courier New',monospace";ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(lbl,cx,cy);ctx.restore();
}
function drawLblsPct(ctx,tf,xs,ys,nw,pct,bg,bd,fg,sc){
  for(let i=0;i<nw;i++){
    const a=cl((pct-i/nw)*nw);if(a<=0)continue;
    const[ox,oy]=wpOff(xs,ys,i,sc);
    drawLblAlpha(ctx,tf,xs[i],ys[i],`${i}`,bg,bd,fg,ox,oy,a);
  }
}
function drawCanvasLegend(ctx,items,x,y,fs){
  const lh=Math.round(fs*1.7),pad=Math.round(fs*.75),sw=Math.round(fs*1.9),gap=Math.round(fs*.65);
  ctx.save();ctx.font=`${fs}px 'Courier New',monospace`;
  const maxW=Math.max(...items.map(it=>ctx.measureText(it.label).width));
  const bw=pad+sw+gap+maxW+pad,bh=pad+items.length*lh+pad-Math.round(lh*.15);
  ctx.fillStyle='rgba(7,14,26,.9)';ctx.strokeStyle='#243650';ctx.lineWidth=.8;
  ctx.beginPath();ctx.rect(x,y,bw,bh);ctx.fill();ctx.stroke();
  items.forEach((item,i)=>{
    const iy=y+pad+i*lh+lh/2,ix=x+pad;
    if(item.type==='line'){
      ctx.strokeStyle=item.color;ctx.setLineDash(item.dash||[]);ctx.lineWidth=item.lw||1.5;
      ctx.beginPath();ctx.moveTo(ix,iy);ctx.lineTo(ix+sw,iy);ctx.stroke();ctx.setLineDash([]);
      if(item.marker)drawMk(ctx,null,ix+sw/2,iy,item.color,item.marker,Math.round(fs*.22));
    }else{
      ctx.fillStyle=item.color;ctx.strokeStyle=item.border||'transparent';ctx.lineWidth=.8;
      ctx.fillRect(ix,iy-Math.round(lh*.28),sw,Math.round(lh*.56));
      if(item.border)ctx.strokeRect(ix,iy-Math.round(lh*.28),sw,Math.round(lh*.56));
    }
    ctx.fillStyle='#8cb4d4';ctx.font=`${fs}px 'Courier New',monospace`;
    ctx.textAlign='left';ctx.textBaseline='middle';
    ctx.fillText(item.label,ix+sw+gap,iy);
  });
  ctx.restore();
}
function drawTrajFrame(cid,key,gp=1){
  const cv=document.getElementById(cid);if(!cv)return;
  const rect=cv.getBoundingClientRect();if(rect.width<2||rect.height<2)return;
  const dpr=window.devicePixelRatio||1;
  const bw=Math.round(rect.width*dpr),bh=Math.round(rect.height*dpr);
  if(cv.width!==bw||cv.height!==bh){cv.width=bw;cv.height=bh;}
  const ctx=cv.getContext('2d');
  ctx.setTransform(dpr,0,0,dpr,0,0);
  const cw=rect.width,ch=rect.height;
  const{xi,yi,nw,xr,yr,xm,ym,ells,ax0,ax1,ay0,ay1}=getCache(key);
  const px=(ax1-ax0)*.11,py=(ay1-ay0)*.11;
  const pad=Math.round(Math.max(36,cw*.038));
  const fs=Math.round(Math.max(10,Math.min(14,cw*.013)));
  const tf=makeTF(ax0-px,ax1+px,ay0-py,ay1+py,cw,ch,pad,key==='circle');
  cv._tf=tf;cv._xi=xi;cv._yi=yi;cv._xm=xm;cv._ym=ym;cv._dpr=dpr;

  const trP=cl(gp/.55),idP=cl(gp/.55),mnP=cl((gp-.28)/.52),elA=cl((gp-.55)/.35),lbP=cl((gp-.6)/.4);
  const mk=Math.max(2.5,fs*.22);

  ctx.fillStyle=COL.bg;ctx.fillRect(0,0,cw,ch);
  drawGrid(ctx,tf,ax0-px,ax1+px,ay0-py,ay1+py,cw,ch,pad,fs);

  if(ST.ell)ells.forEach(p=>drawEllAlpha(ctx,tf,p,elA));
  if(ST.trials){
    for(let i=0;i<3;i++){
      drawLinePct(ctx,tf,xr[i],yr[i],COL.trial,DSH[i],1,trP);
      drawMksPct(ctx,tf,xr[i],yr[i],COL.trial,MRK[i],mk,trP);
    }
  }
  drawLinePct(ctx,tf,xi,yi,COL.ideal,[6,3],1.5,idP);
  drawMksPct(ctx,tf,xi,yi,COL.ideal,'rect',mk,idP);
  if(ST.mean){
    drawLinePct(ctx,tf,xm,ym,COL.mean,[],1.8,mnP);
    drawMksPct(ctx,tf,xm,ym,COL.mean,'circle',mk,mnP);
  }
  if(ST.lbl){
    drawLblsPct(ctx,tf,xi,yi,nw,lbP,'rgba(15,26,42,.92)','#253d59','#7a9dbf',Math.max(16,fs*1.4));
    if(ST.mean)drawLblsPct(ctx,tf,xm,ym,nw,lbP,'rgba(127,29,29,.6)','#c85050','#f9a8a8',Math.max(24,fs*2.1));
  }
  const legFs=Math.round(Math.max(11,Math.min(15,cw*.014)));
  const legItems=[
    ...(ST.trials?[
      {type:'line',color:COL.trial,dash:DSH[0],marker:'circle',lw:1,label:'Trial 1'},
      {type:'line',color:COL.trial,dash:DSH[1],marker:'rect',lw:1,label:'Trial 2'},
      {type:'line',color:COL.trial,dash:DSH[2],marker:'triangle',lw:1,label:'Trial 3'},
    ]:[]),
    {type:'line',color:COL.ideal,dash:[6,3],marker:'rect',lw:1.5,label:'Ideal Path'},
    ...(ST.mean?[{type:'line',color:COL.mean,dash:[],marker:'circle',lw:1.8,label:'Mean Trajectory'}]:[]),
    ...(ST.ell?[{type:'fill',color:'rgba(248,113,113,.25)',border:'rgba(248,113,113,.7)',label:'2\u03c3 cov. ellipse'}]:[]),
  ];
  drawCanvasLegend(ctx,legItems,pad+4,pad+4,legFs);
}
function startAnim(cid,key){
  if(ANIMS[cid])cancelAnimationFrame(ANIMS[cid]);
  const t0=performance.now(),dur=2400;
  function frame(now){
    const t=Math.min((now-t0)/dur,1);
    drawTrajFrame(cid,key,ease(t));
    if(t<1)ANIMS[cid]=requestAnimationFrame(frame);else delete ANIMS[cid];
  }
  ANIMS[cid]=requestAnimationFrame(frame);
}
function redrawAll(){
  ['tc','ts'].forEach(cid=>{if(ANIMS[cid]){cancelAnimationFrame(ANIMS[cid]);delete ANIMS[cid];}});
  drawTrajFrame('tc','circle',1);drawTrajFrame('ts','straight',1);
}
function setupTT(cid,ttid){
  const cv=document.getElementById(cid),tt=document.getElementById(ttid);if(!cv||!tt)return;
  cv.addEventListener('mousemove',e=>{
    const r=cv.getBoundingClientRect();
    const cx=e.clientX-r.left,cy=e.clientY-r.top;
    const tf=cv._tf,xi=cv._xi,yi=cv._yi,xm=cv._xm,ym=cv._ym;if(!tf||!xi)return;
    let bi=-1,bd=Infinity,bx=0,by=0,bn='';
    xi.forEach((x,i)=>{const d=Math.sqrt((tf.x(x)-cx)**2+(tf.y(yi[i])-cy)**2);if(d<bd){bd=d;bi=i;bx=x;by=yi[i];bn='ideal';}});
    if(xm)xm.forEach((x,i)=>{const d=Math.sqrt((tf.x(x)-cx)**2+(tf.y(ym[i])-cy)**2);if(d<bd){bd=d;bi=i;bx=x;by=ym[i];bn='mean';}});
    if(bd<20){tt.style.display='block';tt.style.left=(cx+14)+'px';tt.style.top=(cy-28)+'px';
      tt.innerHTML=`${bn} wp${bi} &nbsp;(${bx.toFixed(2)}, ${by.toFixed(2)}) cm`;}
    else tt.style.display='none';
  });
  cv.addEventListener('mouseleave',()=>tt.style.display='none');
}
[['bt-trials','trials'],['bt-ell','ell'],['bt-lbl','lbl'],['bt-mean','mean']].forEach(([id,key])=>{
  const btn=document.getElementById(id);if(!btn)return;
  btn.addEventListener('click',()=>{ST[key]=!ST[key];btn.classList.toggle('off',!ST[key]);redrawAll();});
});
let activeTab='circle';
function activateTab(p){
  activeTab=p;
  document.getElementById('pnl-'+p).classList.add('on');
  const cid=p==='circle'?'tc':'ts';
  requestAnimationFrame(()=>startAnim(cid,p));
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');activateTab(b.dataset.p);
}));
document.getElementById('btn-replay').addEventListener('click',()=>{
  startAnim(activeTab==='circle'?'tc':'ts',activeTab);
});
let rt;
window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(redrawAll,120);});
setupTT('tc','tt-c');setupTT('ts','tt-s');
activateTab('circle');
</script>
</body>
</html>
