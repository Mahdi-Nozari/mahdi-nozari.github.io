<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>ربات چندوجهی غلتان نرم – مهدی نوذری</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <style>
    /* ══════════════════════════════════════════════════════════════
       SLIDE LAYOUT — text RIGHT, media LEFT
       In dir="rtl" CSS-Grid places column-1 on the RIGHT side,
       so .slide-text (first child) = right, .slide-media (second) = left.
       ══════════════════════════════════════════════════════════════ */

    .reveal .slides section { text-align: right; }

    .slide-cols {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
      align-items: start;
      margin-top: 14px;
      font-size: 0.8em;
    }
    .slide-cols.text-wide { grid-template-columns: 3fr 2fr; }
    .slide-wide           { margin-top: 14px; font-size: 0.8em; }

/* ══════════════════════════════════════════════════════════════
   MEDIA PANEL BASE — dark glass technical panel
   For .img-slot and .vid-slot
   Supports:
   - normal images: <img>
   - videos: <video>
   - sharp SVG graphs: <object> or <iframe>
   - optional zoom: .zoomable-media
   ══════════════════════════════════════════════════════════════ */

.img-slot,
.vid-slot {
  --media-accent: 145, 205, 255;
  --media-radius: 14px;
  --media-pad-x: 14px;
  --media-pad-bottom: 30px;

  position: relative;
  border-radius: var(--media-radius);
  overflow: hidden;
  box-sizing: border-box;
  isolation: isolate;

  background:
    radial-gradient(circle at 18% 16%, rgba(var(--media-accent), 0.075), transparent 34%),
    radial-gradient(circle at 85% 88%, rgba(var(--media-accent), 0.045), transparent 36%),
    linear-gradient(155deg, rgba(12, 22, 44, 0.82), rgba(3, 8, 22, 0.94));

  border: 1px solid rgba(255,255,255,0.13);

  box-shadow:
    0 10px 28px rgba(0,0,0,0.34),
    inset 0 1px 0 rgba(255,255,255,0.07),
    inset 0 0 26px rgba(255,255,255,0.025),
    inset 0 -24px 34px rgba(0,0,0,0.24);
}

/* inner frame + corner brackets */
.img-slot::after,
.vid-slot::after {
  content: "";
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
  border-radius: inherit;

  background:
    linear-gradient(90deg, rgba(var(--media-accent),0.62) 22px, transparent 22px)
      calc(100% - 12px) 12px / 22px 2px no-repeat,
    linear-gradient(180deg, rgba(var(--media-accent),0.62) 22px, transparent 22px)
      calc(100% - 12px) 12px / 2px 22px no-repeat,

    linear-gradient(270deg, rgba(var(--media-accent),0.42) 22px, transparent 22px)
      12px calc(100% - 12px) / 22px 2px no-repeat,
    linear-gradient(0deg, rgba(var(--media-accent),0.42) 22px, transparent 22px)
      12px calc(100% - 12px) / 2px 22px no-repeat,

    linear-gradient(rgba(255,255,255,0.045), rgba(255,255,255,0.045))
      center / calc(100% - 22px) calc(100% - 22px) no-repeat;

  box-shadow:
    inset 0 0 0 1px rgba(255,255,255,0.045),
    inset 0 0 0 2px rgba(var(--media-accent),0.025);

  opacity: 0.95;
}

/* very subtle technical texture */
.img-slot .media-noise,
.vid-slot .media-noise {
  display: none;
}

/* caption strip — only appears if data-caption exists */
.img-slot[data-caption]::before,
.vid-slot[data-caption]::before {
  content: attr(data-caption);
  position: absolute;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 2;

  padding: 24px 14px 9px;

  background:
    linear-gradient(
      0deg,
      rgba(2, 8, 20, 0.92) 0%,
      rgba(2, 8, 20, 0.58) 54%,
      transparent 100%
    );

  color: rgba(220, 232, 245, 0.72);
  text-align: center;
  font-family: "Vazirmatn", sans-serif;
  font-size: 0.52em;
  font-weight: 500;
  line-height: 1.45;
  letter-spacing: 0.01em;
}

/* add .no-caption to hide the strip in the slide panel;
   the caption is still forwarded to the zoom modal via data-caption */
.img-slot.no-caption::before,
.vid-slot.no-caption::before {
  display: none;
}

/* without the caption strip the bottom padding can be tighter */
.img-slot.no-caption object,
.img-slot.no-caption iframe,
.img-slot.no-caption img {
  padding-bottom: var(--media-pad-x);
}

/* ══════════════════════════════════════════════════════════════
   IMAGE SLOT
   ══════════════════════════════════════════════════════════════ */

.img-slot {
  min-height: 205px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.img-slot img,
.img-slot canvas {
  position: relative;
  z-index: 1;

  max-width: 100%;
  max-height: 100%;
  object-fit: contain;

  padding: var(--media-pad-x) var(--media-pad-x) var(--media-pad-bottom);
  box-sizing: border-box;

  border-radius: 8px;

  filter:
    drop-shadow(0 6px 14px rgba(0,0,0,0.24))
    saturate(1.02);
}

/* sharp SVG graphs through object/iframe */
.img-slot object,
.img-slot iframe {
  position: relative;
  z-index: 1;

  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;

  display: block;
  box-sizing: border-box;

  padding: var(--media-pad-x) var(--media-pad-x) var(--media-pad-bottom);

  border: none;
  outline: none;
  background: transparent;

  overflow: hidden;
}

/* precise vector graph mode */
.img-slot.vector-media {
  overflow: hidden;
}

.img-slot.vector-media img,
.img-slot.vector-media canvas,
.img-slot.vector-media object,
.img-slot.vector-media iframe,
.img-slot img[src$=".svg"] {
  filter: none;
  image-rendering: auto;
}

/* reduce padding for vector media without captions */
.img-slot.vector-media:not([data-caption]) img,
.img-slot.vector-media:not([data-caption]) object,
.img-slot.vector-media:not([data-caption]) iframe {
  padding: 12px;
}

/* avoid hover scaling for precise graphs */
.img-slot.vector-media.zoomable-media:hover img {
  transform: none;
  filter: none;
}

/* if object/iframe is zoomable, do not let it steal pointer events */
.img-slot.zoomable-media object,
.img-slot.zoomable-media iframe {
  pointer-events: none;
}

/* ══════════════════════════════════════════════════════════════
   ZOOMABLE IMAGE SLOT
   ══════════════════════════════════════════════════════════════ */

.img-slot.zoomable-media {
  cursor: zoom-in;
}

.img-slot.zoomable-media img {
  transition:
    transform 260ms ease,
    filter 260ms ease;
}

.img-slot.zoomable-media:hover img {
  transform: scale(2);
  filter:
    drop-shadow(0 8px 18px rgba(0,0,0,0.30))
    saturate(2);
}

.media-zoom-btn {
  position: absolute;
  top: 14px;
  left: 14px;
  z-index: 5;

  width: 44px;
  height: 44px;
  border-radius: 12px;

  display: flex;
  align-items: center;
  justify-content: center;

  border: 1px solid rgba(var(--media-accent),0.35);
  background:
    linear-gradient(160deg, rgba(12,28,54,0.78), rgba(2,8,20,0.88));
  color: rgba(225,240,255,0.90);

  box-shadow:
    0 6px 18px rgba(0,0,0,0.28),
    inset 0 1px 0 rgba(255,255,255,0.08),
    0 0 14px rgba(var(--media-accent),0.08);

  cursor: zoom-in;
  opacity: 0.84;

  transition:
    opacity 180ms ease,
    transform 180ms ease,
    border-color 180ms ease;
}

.media-zoom-btn svg {
  width: 20px;
  height: 20px;
}

.media-zoom-btn:hover {
  opacity: 1;
  transform: translateY(-1px);
  border-color: rgba(var(--media-accent),0.58);
}

/* ══════════════════════════════════════════════════════════════
   VIDEO SLOT
   ══════════════════════════════════════════════════════════════ */

.vid-slot {
  min-height: 240px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.vid-slot video {
  position: relative;
  z-index: 1;

  width: 100%;
  height: 100%;
  object-fit: contain;

  padding: 12px 12px var(--media-pad-bottom);
  box-sizing: border-box;

  border-radius: 8px;
  filter: drop-shadow(0 6px 14px rgba(0,0,0,0.24));
}

/* for real videos, usually caption is unnecessary */
.vid-slot:has(video)::before {
  display: none;
}

/* ══════════════════════════════════════════════════════════════
   EMPTY STATES
   ══════════════════════════════════════════════════════════════ */

.img-slot:not(:has(img)):not(:has(canvas)):not(:has(object)):not(:has(iframe)) {
  background:
    radial-gradient(circle at 50% 42%, rgba(var(--media-accent),0.095), transparent 30%),
    linear-gradient(155deg, rgba(12, 22, 44, 0.82), rgba(3, 8, 22, 0.94));
}

.img-slot:not(:has(img)):not(:has(canvas)):not(:has(object)):not(:has(iframe))::before {
  content: "IMAGE";
  position: absolute;
  z-index: 1;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  color: rgba(var(--media-accent),0.34);
  font-size: 0.56em;
  font-weight: 700;
  letter-spacing: 0.16em;
  padding: 18px 24px;
  border-radius: 10px;
  border: 1px solid rgba(var(--media-accent),0.18);
  background: rgba(255,255,255,0.025);
}

.vid-slot:not(:has(video)) {
  background:
    radial-gradient(circle at 50% 42%, rgba(var(--media-accent),0.095), transparent 30%),
    linear-gradient(155deg, rgba(12, 22, 44, 0.82), rgba(3, 8, 22, 0.94));
}

.vid-slot:not(:has(video))::before {
  content: "VIDEO";
  position: absolute;
  z-index: 1;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);

  color: rgba(var(--media-accent),0.34);
  font-size: 0.56em;
  font-weight: 700;
  letter-spacing: 0.16em;
  padding: 18px 24px;
  border-radius: 10px;
  border: 1px solid rgba(var(--media-accent),0.18);
  background: rgba(255,255,255,0.025);
}

/* ══════════════════════════════════════════════════════════════
   OPTIONAL COLOR VARIANTS
   ══════════════════════════════════════════════════════════════ */

.img-slot.green-media,
.vid-slot.green-media {
  --media-accent: 145, 255, 175;
}

.img-slot.red-media,
.vid-slot.red-media {
  --media-accent: 255, 145, 145;
}

.img-slot.cyan-media,
.vid-slot.cyan-media {
  --media-accent: 120, 230, 255;
}

/* ══════════════════════════════════════════════════════════════
   IMAGE / SVG ZOOM MODAL
   Works with:
   - <img>
   - <object>
   - <iframe>
   Requires JS support for object/iframe zoom
   ══════════════════════════════════════════════════════════════ */

.media-zoom-modal {
  position: fixed;
  inset: 0;
  z-index: 99999;

  display: none;
  align-items: center;
  justify-content: center;

  background:
    radial-gradient(circle at 50% 46%, rgba(145,205,255,0.10), transparent 42%),
    rgba(0, 4, 14, 0.86);

  backdrop-filter: blur(10px);
}

.media-zoom-modal.is-open {
  display: flex;
}

.media-zoom-shell {
  position: relative;
  width: min(92vw, 1500px);
  height: min(86vh, 920px);

  border-radius: 18px;
  overflow: hidden;

  background:
    radial-gradient(circle at 18% 16%, rgba(145,205,255,0.075), transparent 34%),
    linear-gradient(155deg, rgba(12, 22, 44, 0.90), rgba(3, 8, 22, 0.96));

  border: 1px solid rgba(255,255,255,0.16);

  box-shadow:
    0 18px 70px rgba(0,0,0,0.58),
    inset 0 1px 0 rgba(255,255,255,0.08),
    inset 0 0 32px rgba(255,255,255,0.025);
}

.media-zoom-toolbar {
  position: absolute;
  top: 14px;
  left: 14px;
  right: 14px;
  z-index: 4;

  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;

  pointer-events: none;
}

.media-zoom-caption {
  max-width: 70%;
  padding: 8px 14px;
  border-radius: 10px;

  background: rgba(2,8,20,0.62);
  border: 1px solid rgba(255,255,255,0.10);

  color: rgba(225,235,245,0.88);
  font-family: "Vazirmatn", sans-serif;
  font-size: 1em;
  font-weight: 500;
  line-height: 1.5;

  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;

  pointer-events: auto;
}

.media-zoom-controls {
  display: flex;
  gap: 8px;
  pointer-events: auto;
}

.media-zoom-controls button {
  width: 42px;
  height: 42px;
  border-radius: 11px;

  border: 1px solid rgba(145,205,255,0.26);
  background: rgba(2,8,20,0.66);
  color: rgba(235,245,255,0.92);

  display: flex;
  align-items: center;
  justify-content: center;

  cursor: pointer;

  box-shadow:
    0 6px 18px rgba(0,0,0,0.26),
    inset 0 1px 0 rgba(255,255,255,0.07);

  transition:
    border-color 160ms ease,
    background 160ms ease,
    transform 160ms ease;
}

.media-zoom-controls button svg {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

.media-zoom-controls button:hover {
  border-color: rgba(145,205,255,0.52);
  background: rgba(10,25,50,0.82);
  transform: translateY(-1px);
}

.media-zoom-stage {
  position: absolute;
  inset: 58px 22px 22px;

  display: flex;
  align-items: center;
  justify-content: center;

  overflow: hidden;
  border-radius: 14px;

  background:
    linear-gradient(rgba(255,255,255,0.035), rgba(255,255,255,0.035))
      center / 100% 100% no-repeat;

  cursor: grab;
}

.media-zoom-stage.is-dragging {
  cursor: grabbing;
}

.media-zoom-content {
  max-width: 100%;
  max-height: 100%;
  width: 100%;
  height: 100%;

  display: flex;
  align-items: center;
  justify-content: center;

  transform-origin: center center;
  will-change: transform;
}

/* SVG zoom mode — no GPU pre-raster so the browser re-rasterizes
   from the vector source on every resize, keeping lines pixel-perfect */
.media-zoom-content.svg-mode {
  will-change: unset;
}
.media-zoom-content.svg-mode .media-zoom-image {
  /* allow the img to grow beyond the stage so zoom actually enlarges it */
  max-width: none;
  max-height: none;
  object-fit: unset;
}

.media-zoom-image,
.media-zoom-object {
  max-width: 100%;
  max-height: 100%;
  width: 100%;
  height: 100%;

  object-fit: contain;

  border: none;
  outline: none;
  background: transparent;

  user-select: none;
  -webkit-user-drag: none;

  border-radius: 8px;
}

.media-zoom-image {
  filter: drop-shadow(0 8px 24px rgba(0,0,0,0.32));
}

.media-zoom-object {
  pointer-events: none;
}


/* ── Annotation boxes (used with annotbox.js) ─────────────────── */

    /* Glitch entrance keyframes — fired when slide becomes active */
    @keyframes annot-glitch-in {
      0%   { opacity: 0;   transform: translateX(8px)  skewX(-2deg);  clip-path: inset(45% 0 45% 0); }
      6%   { opacity: 0.8; transform: translateX(-5px) skewX( 1.5deg); clip-path: inset(0% 0 0% 0);  }
      11%  { opacity: 0.2; transform: translateX(4px)  skewX(-0.8deg); clip-path: inset(20% 0 10% 0); }
      17%  { opacity: 1;   transform: translateX(-2px) skewX( 0.4deg); clip-path: inset(0% 0 0% 0);  }
      24%  { opacity: 0.6; transform: translateX(1px)  skewX(-0.2deg); }
      32%  { opacity: 1;   transform: translateX(0)    skewX(0);       }
      100% { opacity: 1;   transform: translateX(0)    skewX(0);       }
    }

    .annot-box {
      position: absolute;
      background: rgba(0,18,48,0.82);
      border: 1px solid rgba(0,229,255,0.45);
      box-shadow:
        0 0 12px rgba(0,229,255,0.12),
        inset 0 0 8px rgba(0,229,255,0.04);
      padding: 10px 13px;
      border-radius: 6px;
      font-size: 0.72em;
      line-height: 1.5;
      box-sizing: border-box;
      backdrop-filter: blur(4px);
      /* hidden by default — animation sets it to visible */
      opacity: 0;
      z-index: 5; 
    }

    /* All boxes appear at once when the slide becomes active.
       The 0.35 s delay lets the slide-transition settle first. */
    .present .annot-box {
      animation: annot-glitch-in 1s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      animation-delay: var(--annot-delay, 2s);
    }

    .annot-label { display:block; color:#00e5ff; font-weight:bold; margin-bottom:3px; }
    .annot-part  { display:block; margin-bottom:2px; color:#cde; }
    .annot-desc  { display:block; color:rgba(180,200,220,0.7); font-size:0.88em; }
    .annot-svg   {
      position:absolute; top:50%; width:1px; height:1px;
      pointer-events:none; overflow:visible; transform:translateY(-50%);
      z-index: 5;
    }

    /* FSM slide */
    .reveal section.fsm-rolling-slide {
      --fsm-cyan: rgba(0, 229, 255, 0.82);
      --fsm-panel-bg: linear-gradient(165deg, rgba(4,24,56,0.70), rgba(1,10,28,0.86));

      width: 100% !important;
      height: 100% !important;
      min-height: 650px !important;
      padding: 0 !important;
      box-sizing: border-box !important;
    }

    /* Main two-column layout */
    .reveal section.fsm-rolling-slide .fsm-sync-layout {
      width: 94% !important;
      height: 650px !important;
      min-height: 620px !important;
      margin: 100px auto 0 auto !important;

      display: grid !important;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1.05fr) !important;
      gap: 24px !important;
      align-items: stretch !important;

      box-sizing: border-box !important;
    }

    /* Shared panel style */
    .reveal section.fsm-rolling-slide .fsm-panel {
      position: relative !important;
      min-width: 0 !important;
      height: 100% !important;
      min-height: 560px !important;

      border-radius: 18px;
      overflow: hidden;
      isolation: isolate;

      background:
        radial-gradient(circle at 18% 16%, rgba(0,229,255,0.055), transparent 32%),
        radial-gradient(circle at 86% 82%, rgba(0,229,255,0.035), transparent 30%),
        var(--fsm-panel-bg);

      border: 1px solid rgba(0,229,255,0.22);

      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 0 0 1px rgba(0,229,255,0.05),
        0 18px 45px rgba(0,0,0,0.34),
        0 0 36px rgba(0,229,255,0.08);
    }

    /* High-tech overlay */
    .reveal section.fsm-rolling-slide .fsm-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, transparent, rgba(0,229,255,0.08), transparent) 0 0 / 240% 100%,
        repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 7px);
      opacity: 0.45;
      z-index: 2;
    }

    /* Panel title */
    .reveal section.fsm-rolling-slide .fsm-panel-title {
      position: absolute;
      top: 14px;
      right: 18px;
      z-index: 5;

      padding: 6px 10px;
      border-radius: 999px;

      font: 600 30px/1.2 "Vazirmatn", sans-serif;
      letter-spacing: .06em;
      text-transform: uppercase;

      color: rgba(220, 250, 255, 0.92);
      background: rgba(0, 15, 38, 0.46);
      border: 1px solid rgba(0,229,255,0.18);
      backdrop-filter: blur(1px);
    }

    /* Three.js mount */
    .reveal section.fsm-rolling-slide #dodecahedronFsmMount {
      position: absolute !important;
      inset: 52px 12px 12px 12px !important;

      width: auto !important;
      height: auto !important;
      min-height: 460px !important;

      border-radius: 14px;
      overflow: hidden;
      z-index: 1;
    }

    /* FSM iframe */
    .reveal section.fsm-rolling-slide .fsm-diagram-panel iframe {
      position: absolute !important;
      inset: 52px 12px 12px 12px !important;

      width: calc(100% - 24px) !important;
      height: calc(100% - 64px) !important;
      min-height: 460px !important;

      border: 0;
      background: transparent;
      z-index: 1;
    }

    /* Optional responsive fallback */
    @media (max-width: 980px) {
      .reveal section.fsm-rolling-slide .fsm-sync-layout {
        grid-template-columns: 1fr !important;
        height: 86vh !important;
        min-height: 860px !important;
      }

      .reveal section.fsm-rolling-slide .fsm-panel {
        min-height: 400px !important;
      }

      .reveal section.fsm-rolling-slide #dodecahedronFsmMount,
      .reveal section.fsm-rolling-slide .fsm-diagram-panel iframe {
        min-height: 320px !important;
      }
    }
    /* ══════════════════════════════════════════════════════════════
       KEY RESULTS CARDS  (نتایج کلیدی)
       ─────────────────────────────────────────────────────────────
       To change values  → edit .kr-card content in 07-conclusion.html
       To change timing  → edit animation-delay values below
       To add/remove a card → copy/delete a .kr-card block in the HTML
       ══════════════════════════════════════════════════════════════ */

    .kr-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      margin-top: 24px;
    }

    .kr-card {
      position: relative;
      background: rgba(0, 8, 28, 0.75);
      border: 1px solid rgba(0, 229, 255, 0.28);
      border-radius: 8px;
      padding: 26px 14px 22px;
      text-align: center;
      box-shadow:
        0 0 18px rgba(0, 229, 255, 0.06),
        0 4px 24px rgba(0, 0, 0, 0.55),
        inset 0 0 30px rgba(0, 0, 0, 0.30);
      overflow: hidden;
      opacity: 0; /* hidden until animation fires */
    }

    /* bottom accent bar */
    .kr-card::after {
      content: '';
      position: absolute;
      bottom: 0; left: 18%; right: 18%; height: 2px;
      background: linear-gradient(90deg, transparent, rgba(0,229,255,0.60), transparent);
    }

    /* big number */
    .kr-value {

<script>
(function () {
  function createZoomModal() {
    let modal = document.querySelector('.media-zoom-modal');
    if (modal) return modal;

    modal = document.createElement('div');
    modal.className = 'media-zoom-modal';
    modal.innerHTML = `
      <div class="media-zoom-shell">
        <div class="media-zoom-toolbar">
          <div class="media-zoom-caption"></div>
          <div class="media-zoom-controls">
            <button type="button" data-zoom-action="out" aria-label="Zoom out">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
            </button>
            <button type="button" data-zoom-action="reset" aria-label="Reset zoom">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 5a8 8 0 1 1-12 7"/><polyline points="1 12 4 9.5 7 12"/></svg>
            </button>
            <button type="button" data-zoom-action="in" aria-label="Zoom in">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/><line x1="16.5" y1="16.5" x2="21" y2="21"/></svg>
            </button>
            <button type="button" data-zoom-action="close" aria-label="Close">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>

        <div class="media-zoom-stage">
          <div class="media-zoom-content"></div>
        </div>
      </div>
    `;

    document.body.appendChild(modal);
    return modal;
  }

  const modal = createZoomModal();
  const stage = modal.querySelector('.media-zoom-stage');
  const zoomContent = modal.querySelector('.media-zoom-content');
  const captionEl = modal.querySelector('.media-zoom-caption');

  let scale = 1;
  let tx = 0;
  let ty = 0;
  let dragging = false;
  let lastX = 0;
  let lastY = 0;

  function render() {
    if (zoomContent.classList.contains('svg-mode')) {
      // Resize the <img> directly so the browser re-rasterizes the SVG
      // from its vector source at the new size — stays crisp at any zoom level.
      const svgImg = zoomContent.querySelector('.media-zoom-image');
      if (svgImg) {
        const baseW = parseFloat(zoomContent.dataset.svgBaseW || stage.clientWidth);
        const baseH = parseFloat(zoomContent.dataset.svgBaseH || stage.clientHeight);
        svgImg.style.width  = (baseW * scale) + 'px';
        svgImg.style.height = (baseH * scale) + 'px';
      }
      // Only translate — no scale() so no GPU-layer bitmap upscaling
      zoomContent.style.transform = `translate(${tx}px, ${ty}px)`;
    } else {
      zoomContent.style.transform = `translate(${tx}px, ${ty}px) scale(${scale})`;
    }
  }

  function resetZoom() {
    scale = 1;
    tx = 0;
    ty = 0;
    render();
  }

  function closeZoom() {
    modal.classList.remove('is-open');
    zoomContent.innerHTML = '';
    zoomContent.classList.remove('svg-mode');
    document.body.classList.remove('media-zoom-active');
    resetZoom();
  }

  function getZoomSource(slot) {
    const img = slot.querySelector('img');
    const obj = slot.querySelector('object');
    const frame = slot.querySelector('iframe');

    if (img) {
      return {
        type: 'img',
        src: img.getAttribute('data-zoom-src') || img.currentSrc || img.src,
        alt: img.getAttribute('alt') || ''
      };
    }

    if (obj) {
      return {
        type: 'object',
        src: obj.getAttribute('data-zoom-src') || obj.getAttribute('data') || '',
        alt: ''
      };
    }

    if (frame) {
      return {
        type: 'iframe',
        src: frame.getAttribute('data-zoom-src') || frame.getAttribute('src') || '',
        alt: ''
      };
    }

    return null;
  }

  function openZoom(slot) {
    const source = getZoomSource(slot);
    if (!source || !source.src) return;

    const caption = slot.getAttribute('data-caption') || source.alt || '';
    captionEl.textContent = caption;

    zoomContent.innerHTML = '';

    let el;

    if (source.type === 'object') {
      // Use <img> — unlike <object>, it has no isolated browsing context,
      // so the browser can re-rasterize from the SVG vector source when
      // its rendered size changes (our crisp-zoom strategy).
      el = document.createElement('img');
      el.setAttribute('src', source.src);
      el.setAttribute('alt', caption || '');
      el.className = 'media-zoom-image';
      zoomContent.classList.add('svg-mode');
      el.addEventListener('load', function () {
        // Snapshot the stage size as the 1× base so render() can scale from it
        zoomContent.dataset.svgBaseW = stage.clientWidth;
        zoomContent.dataset.svgBaseH = stage.clientHeight;
        el.style.width  = stage.clientWidth  + 'px';
        el.style.height = stage.clientHeight + 'px';
      }, { once: true });
    } else if (source.type === 'iframe') {
      el = document.createElement('iframe');
      el.setAttribute('src', source.src);
      el.className = 'media-zoom-object';
    } else {
      el = document.createElement('img');
      el.setAttribute('src', source.src);
      el.setAttribute('alt', source.alt || caption || 'Zoomed image');
      el.className = 'media-zoom-image';
    }

    zoomContent.appendChild(el);

    modal.classList.add('is-open');
    document.body.classList.add('media-zoom-active');
    resetZoom();
  }

  function clampScale(value) {
    return Math.max(1, Math.min(6, value));
  }

  function zoomBy(factor) {
    const oldScale = scale;
    scale = clampScale(scale * factor);

    if (scale === 1) {
      tx = 0;
      ty = 0;
    } else if (oldScale !== scale) {
      tx *= scale / oldScale;
      ty *= scale / oldScale;
    }

    render();
  }

  function initZoomableSlots(root = document) {
    const slots = root.querySelectorAll('.img-slot.zoomable-media');

    slots.forEach((slot) => {
      if (slot.dataset.zoomReady === 'true') return;

      const source = getZoomSource(slot);
      if (!source || !source.src) return;

      slot.dataset.zoomReady = 'true';

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'media-zoom-btn';
      btn.setAttribute('aria-label', 'Zoom image');
      btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/><line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/></svg>';

      slot.appendChild(btn);

      function handleOpen(ev) {
        ev.preventDefault();
        ev.stopPropagation();
        openZoom(slot);
      }

      btn.addEventListener('click', handleOpen);
      slot.addEventListener('dblclick', handleOpen);
    });
  }

  modal.addEventListener('click', function (ev) {
    if (ev.target === modal) closeZoom();
  });

  modal.querySelectorAll('[data-zoom-action]').forEach((btn) => {
    btn.addEventListener('click', function (ev) {
      ev.preventDefault();
      ev.stopPropagation();

      const action = btn.getAttribute('data-zoom-action');

      if (action === 'close') closeZoom();
      if (action === 'in') zoomBy(1.25);
      if (action === 'out') zoomBy(0.8);
      if (action === 'reset') resetZoom();
    });
  });

  stage.addEventListener('wheel', function (ev) {
    if (!modal.classList.contains('is-open')) return;

    ev.preventDefault();
    ev.stopPropagation();

    const factor = ev.deltaY < 0 ? 1.12 : 0.90;
    zoomBy(factor);
  }, { passive: false });

  stage.addEventListener('pointerdown', function (ev) {
    if (scale <= 1) return;

    ev.preventDefault();
    ev.stopPropagation();

    dragging = true;
    lastX = ev.clientX;
    lastY = ev.clientY;
    stage.classList.add('is-dragging');
    stage.setPointerCapture(ev.pointerId);
  });

  stage.addEventListener('pointermove', function (ev) {
    if (!dragging) return;

    ev.preventDefault();
    ev.stopPropagation();

    tx += ev.clientX - lastX;
    ty += ev.clientY - lastY;

    lastX = ev.clientX;
    lastY = ev.clientY;

    render();
  });

  stage.addEventListener('pointerup', function (ev) {
    dragging = false;
    stage.classList.remove('is-dragging');

    try {
      stage.releasePointerCapture(ev.pointerId);
    } catch (e) {}
  });

  document.addEventListener('keydown', function (ev) {
    if (!modal.classList.contains('is-open')) return;

    ev.stopPropagation();

    if (ev.key === 'Escape') {
      ev.preventDefault();
      closeZoom();
    }

    if (ev.key === '+' || ev.key === '=') {
      ev.preventDefault();
      zoomBy(1.25);
    }

    if (ev.key === '-' || ev.key === '_') {
      ev.preventDefault();
      zoomBy(0.8);
    }

    if (ev.key === '0') {
      ev.preventDefault();
      resetZoom();
    }

    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(ev.key)) {
      ev.preventDefault();
    }
  }, true);

  document.addEventListener('DOMContentLoaded', function () {
    initZoomableSlots(document);
  });

  if (window.Reveal) {
    Reveal.on('ready', function () {
      initZoomableSlots(document);
    });

    Reveal.on('slidechanged', function (event) {
      initZoomableSlots(event.currentSlide || document);
    });

    Reveal.on('fragmentshown', function (event) {
      initZoomableSlots(event.fragment || document);
    });
  }

  window.initZoomableMediaSlots = initZoomableSlots;
})();
</script>

  <!-- ── Video autoplay on slide change ──────────────────────────────
       Listens on the .reveal DOM element directly — works even when
       Reveal is initialised as an ES-module local instance (not on
       window.Reveal), because Reveal always dispatches its events on
       its wrapper element regardless of how it was imported.
       ──────────────────────────────────────────────────────────────── -->
  <script>
    (function () {
      function playVideosIn(slide) {
        if (!slide) return;
        slide.querySelectorAll('video').forEach(function (v) {
          v.play().catch(function () {
            /* browser blocked autoplay — user can press play manually */
          });
        });
      }

      function pauseAllVideos() {
        document.querySelectorAll('.reveal .slides video').forEach(function (v) {
          v.pause();
          v.currentTime = 0;
        });
      }

      window.addEventListener('load', function () {
        var wrapper = document.querySelector('.reveal');
        if (!wrapper) return;

        /* slidechanged fires on the wrapper element with currentSlide
           directly on the event object (Reveal extends the DOM event). */
        wrapper.addEventListener('slidechanged', function (event) {
          pauseAllVideos();
          playVideosIn(event.currentSlide);
        });

        /* ready fires once Reveal has finished initialising —
           auto-play the video if the presentation opens on that slide. */
        wrapper.addEventListener('ready', function (event) {
          playVideosIn(event.currentSlide);
        });
      });
    })();
  </script>
