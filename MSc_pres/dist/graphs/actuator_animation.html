<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8"/>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: transparent;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100vw;
    height: 100vh;
  }
  .act-note {
    position: absolute;
    left: 10px;
    bottom: 8px;
    color: rgba(200,218,240,0.4);
    font-size: 10px;
    line-height: 1.5;
    font-family: 'Vazirmatn', IRANSans, sans-serif;
    pointer-events: none;
  }
</style>
</head>
<body>

<svg id="act-svg" viewBox="0 0 580 380"
     xmlns="http://www.w3.org/2000/svg"
     style="width:100%;height:100%;display:block;">
  <defs>
    <filter id="act-arcGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="act-dotGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="act-arr" markerWidth="9" markerHeight="9"
            refX="4.5" refY="4.5" orient="auto-start-reverse">
      <path d="M1,1.5 L7.5,4.5 L1,7.5 Z" fill="rgba(190,220,255,0.9)"/>
    </marker>
    <marker id="act-pArr" markerWidth="7" markerHeight="7"
            refX="6" refY="3.5" orient="auto">
      <path d="M0,0.5 L6,3.5 L0,6.5 Z" fill="rgba(120,210,255,0.85)"/>
    </marker>
  </defs>

  <!-- Baseline reference -->
  <line x1="80" y1="290" x2="500" y2="290"
        stroke="rgba(255,255,255,0.07)" stroke-width="1.5" stroke-dasharray="6 9"/>

  <!-- Fixed support LEFT -->
  <g stroke="rgba(210,228,250,0.72)" stroke-width="2" fill="none">
    <circle cx="110" cy="290" r="4" fill="rgba(210,228,250,0.9)" stroke="none"/>
    <line x1="110" y1="290" x2="110" y2="317"/>
    <line x1="93"  y1="317" x2="127" y2="317"/>
    <line x1="93"  y1="317" x2="84"  y2="326"/>
    <line x1="101" y1="317" x2="92"  y2="326"/>
    <line x1="109" y1="317" x2="100" y2="326"/>
    <line x1="117" y1="317" x2="108" y2="326"/>
    <line x1="125" y1="317" x2="116" y2="326"/>
    <line x1="133" y1="317" x2="124" y2="326"/>
  </g>

  <!-- Fixed support RIGHT -->
  <g stroke="rgba(210,228,250,0.72)" stroke-width="2" fill="none">
    <circle cx="470" cy="290" r="4" fill="rgba(210,228,250,0.9)" stroke="none"/>
    <line x1="470" y1="290" x2="470" y2="317"/>
    <line x1="453" y1="317" x2="487" y2="317"/>
    <line x1="453" y1="317" x2="444" y2="326"/>
    <line x1="461" y1="317" x2="452" y2="326"/>
    <line x1="469" y1="317" x2="460" y2="326"/>
    <line x1="477" y1="317" x2="468" y2="326"/>
    <line x1="485" y1="317" x2="476" y2="326"/>
    <line x1="493" y1="317" x2="484" y2="326"/>
  </g>

  <!-- Pressure arrows (filled by JS) -->
  <g id="act-pressureGroup"></g>

  <!-- Actuator arc -->
  <path id="act-arc"
        d="M 110,290 L 470,290"
        fill="none"
        stroke="rgba(130,195,255,0.92)"
        stroke-width="3.8"
        stroke-linecap="round"
        filter="url(#act-arcGlow)"/>

  <!-- Dimension line -->
  <line id="act-dimLine"
        x1="290" y1="290" x2="290" y2="290"
        stroke="rgba(200,225,255,0.85)"
        stroke-width="2"
        marker-start="url(#act-arr)"
        marker-end="url(#act-arr)"
        opacity="0"/>

  <!-- Midpoint dot -->
  <circle id="act-midDot"
          cx="290" cy="290" r="5.5"
          fill="rgba(255,255,255,0.95)"
          stroke="rgba(130,195,255,0.9)"
          stroke-width="2.2"
          filter="url(#act-dotGlow)"
          opacity="0"/>

  <!-- Extension label -->
  <text id="act-extLabel"
        x="290" y="280"
        text-anchor="middle"
        font-family="'Vazirmatn', IRANSans, sans-serif"
        font-size="15"
        font-weight="600"
        fill="rgba(220,238,255,0.95)"
        opacity="0">گسترش طولی</text>

</svg>

<!-- <div class="act-note">نمایش شماتیک رفتار عملگر پوسته‌ای تحت فشار داخلی</div> -->

<script>
(function () {
  const X1 = 110, X2 = 470, Y0 = 290;
  const halfChord = (X2 - X1) / 2;
  const midX      = (X1 + X2) / 2;

  const R_MAX     = 12000;
  const R_MIN     = 190;
  const CYCLE_MS  = 7000;
  const HOLD_TOP  = 0.12;
  const HOLD_FLAT = 0.10;
  const ARROW_LEN = 28;
  const N_ARROWS  = 11;

  const arc     = document.getElementById('act-arc');
  const midDot  = document.getElementById('act-midDot');
  const dimLine = document.getElementById('act-dimLine');
  const label   = document.getElementById('act-extLabel');
  const pGroup  = document.getElementById('act-pressureGroup');

  const NS = 'http://www.w3.org/2000/svg';
  const pLines = [];
  for (let i = 0; i < N_ARROWS; i++) {
    const ln = document.createElementNS(NS, 'line');
    ln.setAttribute('stroke', 'rgba(120,210,255,0.78)');
    ln.setAttribute('stroke-width', '1.6');
    ln.setAttribute('stroke-linecap', 'round');
    ln.setAttribute('marker-end', 'url(#act-pArr)');
    ln.setAttribute('opacity', '0');
    pGroup.appendChild(ln);
    pLines.push(ln);
  }

  function easeInOut(t) {
    return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  }

  function update(ts) {
    const phase = (ts % CYCLE_MS) / CYCLE_MS;
    const a = HOLD_FLAT, b = 0.5 - HOLD_TOP/2;
    const c = 0.5 + HOLD_TOP/2, dd = 1 - HOLD_FLAT;

    let inf;
    if      (phase < a)  inf = 0;
    else if (phase < b)  inf = easeInOut((phase - a) / (b - a));
    else if (phase < c)  inf = 1;
    else if (phase < dd) inf = 1 - easeInOut((phase - c) / (dd - c));
    else                 inf = 0;

    const R    = R_MAX - (R_MAX - R_MIN) * inf;
    const h    = R - Math.sqrt(R*R - halfChord*halfChord);
    const topY = Y0 - h;
    const cY   = Y0 + Math.sqrt(R*R - halfChord*halfChord);

    arc.setAttribute('d',
      h < 0.5
        ? `M ${X1},${Y0} L ${X2},${Y0}`
        : `M ${X1},${Y0} A ${R},${R} 0 0,1 ${X2},${Y0}`
    );

    const vis = inf < 0.04 ? 0 : inf;

    midDot.setAttribute('cx', midX);
    midDot.setAttribute('cy', topY);
    midDot.setAttribute('opacity', vis);

    dimLine.setAttribute('x1', midX); dimLine.setAttribute('y1', Y0 - 6);
    dimLine.setAttribute('x2', midX); dimLine.setAttribute('y2', topY + 8);
    dimLine.setAttribute('opacity', vis);

    label.setAttribute('x', midX);
    label.setAttribute('y', topY - 20);
    label.setAttribute('opacity', vis);

    const rc = Math.round(130 + 80*inf);
    const gc = Math.round(195 - 30*inf);
    const bc = Math.round(255 - 50*inf);
    arc.setAttribute('stroke', `rgba(${rc},${gc},${bc},0.93)`);

    const pOpacity = inf < 0.05 ? 0 : inf * 0.85;
    for (let i = 0; i < N_ARROWS; i++) {
      const xPt = X1 + (i + 0.5) * (X2 - X1) / N_ARROWS;
      const disc = R*R - (xPt - midX)*(xPt - midX);
      if (disc < 0 || h < 0.5) { pLines[i].setAttribute('opacity', 0); continue; }
      const yPt = cY - Math.sqrt(disc);
      const nx = (xPt - midX) / R;
      const ny = (yPt - cY)   / R;
      const len = ARROW_LEN * inf;
      pLines[i].setAttribute('x1', xPt - len*nx);
      pLines[i].setAttribute('y1', yPt - len*ny);
      pLines[i].setAttribute('x2', xPt - 3*nx);
      pLines[i].setAttribute('y2', yPt - 3*ny);
      pLines[i].setAttribute('opacity', pOpacity);
    }

    requestAnimationFrame(update);
  }

  requestAnimationFrame(update);
})();
</script>
</body>
</html>
