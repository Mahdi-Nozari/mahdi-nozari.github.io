<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Robot Path — Relative Error</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#070e1a;overflow:hidden;font-family:'Courier New',Courier,monospace}
body{display:flex;flex-direction:column;padding:10px;gap:8px}
.topbar{display:flex;align-items:center;gap:7px;flex-shrink:0;height:32px}
.tab{padding:4px 15px;border-radius:5px;border:1px solid #1a2e47;background:transparent;color:#3d5a7a;cursor:pointer;font-size:12px;letter-spacing:.06em;font-family:'Courier New',monospace;transition:all .15s}
.tab.on{background:rgba(34,211,238,.07);color:#22d3ee;border-color:#22d3ee}
.tab:hover:not(.on){border-color:#243d59;color:#5a7a9a}
.replay{margin-left:auto;display:flex;align-items:center;gap:5px;padding:4px 12px;border-radius:5px;border:1px solid #164e63;background:transparent;color:#22d3ee;cursor:pointer;font-size:11px;font-family:'Courier New',monospace;letter-spacing:.04em;transition:background .15s}
.replay:hover{background:rgba(34,211,238,.08)}
.panel{display:none;flex:1;min-height:0;position:relative}
.panel.on{display:block}
.panel canvas{position:absolute;top:0;left:0;width:100%;height:100%;display:block}
.ec-leg{position:absolute;top:14px;left:14px;z-index:2;pointer-events:none;
  background:rgba(7,14,26,.9);border:1px solid #243650;border-radius:4px;
  padding:8px 12px;display:flex;flex-direction:column;gap:5px}
.ec-li{display:flex;align-items:center;gap:8px;font-size:12px;color:#7a9dbf;white-space:nowrap}
</style>
</head>
<body>

<div class="topbar">
  <button class="tab on" data-p="circle">○ Circle Path</button>
  <button class="tab" data-p="straight">— Straight Path</button>
  <button class="replay" id="btn-replay">&#9654; Replay</button>
</div>

<div class="panel on" id="pnl-circle">
  <canvas id="ec" role="img" aria-label="Relative Euclidean error by waypoint — circle path"></canvas>
  <div class="ec-leg" id="ll-ec"></div>
</div>
<div class="panel" id="pnl-straight">
  <canvas id="es" role="img" aria-label="Relative Euclidean error by waypoint — straight path"></canvas>
  <div class="ec-leg" id="ll-es"></div>
</div>

<script>
const D={
  circle:{nw:11,
    xi:[0,-9.789,-13.528,-9.789,0,12.1,21.889,25.628,21.889,12.1,0],
    yi:[0,7.112,18.62,30.128,37.24,37.24,30.128,18.62,7.112,0,0],
    ex:[[0,-2,-2.5,-1.5,-2.5,-1.5,-0.5,2,4.5,5.5,5.5],[0,-2,-4,-3,-3.5,-2.5,-0.5,3.5,6.5,7,6],[0,-2,-3.5,-2.5,-2.5,-1.5,0,3,5,5.5,7]],
    ey:[[0,1.5,2.5,6,6,7,8,8,7.5,5.5,2],[0,1.5,4.5,7,8,10,11,10,8.5,6.5,1.5],[0,1,4.5,7,7,9,9,9,8.5,6.5,2.5]]},
  straight:{nw:10,
    xi:[0,11.508,23.016,34.523,46.031,57.539,69.047,80.554,92.062,103.57],
    yi:[0,3.739,0,3.739,0,3.739,0,3.739,0,3.739],
    ex:[[0,1.5,4,5.5,5.5,7,9,6.5,10.5,9.5],[0,1,3.5,4,5,5.5,5.5,5.5,9,9],[0,1,3.5,4,4.5,5.5,6,6,7,8]],
    ey:[[0,0.5,0,1.5,0.5,3,5,8.5,12.5,16.5],[0,0,0,1.5,3,6.5,8.5,11,12.5,13.5],[0,0.5,0.5,1,1,3,3.5,5,7.5,10]]}
};
const COL={trialE:['#22d3ee','#fbbf24','#4ade80']};
const DSH=[[],[6,3],[10,3,3,3]];
const MRK=['circle','rect','triangle'];
const EC={};
const avg=a=>a.reduce((s,v)=>s+v,0)/a.length;

function relErr(pd){
  const{xi,yi,ex,ey,nw}=pd;
  const pe=ex.map((r,i)=>r.map((e,j)=>Math.sqrt(e**2+ey[i][j]**2)));
  const cd=[0];for(let i=1;i<nw;i++)cd.push(cd[i-1]+Math.sqrt((xi[i]-xi[i-1])**2+(yi[i]-yi[i-1])**2));
  return pe.map(r=>r.map((e,j)=>cd[j]>0?e/cd[j]*100:0));
}

function makeEC(cid,key){
  if(EC[cid]){EC[cid].destroy();delete EC[cid];}
  const pd=D[key];const re=relErr(pd);const n=pd.nw;
  const lbs=Array.from({length:n},(_,i)=>`wp${i}`);
  const mn=lbs.map((_,j)=>avg(re.map(r=>r[j])));
  const lo=lbs.map((_,j)=>Math.min(...re.map(r=>r[j])));
  const hi=lbs.map((_,j)=>Math.max(...re.map(r=>r[j])));
  EC[cid]=new Chart(document.getElementById(cid),{type:'line',
    data:{labels:lbs,datasets:[
      {label:'_hi',data:hi,fill:1,backgroundColor:'rgba(71,85,105,.15)',borderColor:'transparent',pointRadius:0,tension:.3,order:9},
      {label:'_lo',data:lo,fill:false,borderColor:'transparent',pointRadius:0,order:9},
      ...re.map((r,i)=>({label:`Trial ${i+1}`,data:r,
        borderColor:COL.trialE[i],backgroundColor:COL.trialE[i]+'18',
        borderWidth:2,borderDash:DSH[i],pointRadius:4,pointStyle:MRK[i],
        tension:.3,fill:false,order:3-i})),
      {label:'Mean',data:mn,borderColor:'#dce8f4',backgroundColor:'#dce8f418',
       borderWidth:2.5,pointRadius:4.5,tension:.3,fill:false,order:0}
    ]},
    options:{responsive:true,maintainAspectRatio:false,
      devicePixelRatio:window.devicePixelRatio||2,
      animation:{duration:1300,easing:'easeInOutCubic',
        delay:ctx=>{const d=[0,0,0,200,420,720];return d[ctx.datasetIndex]??0;}},
      plugins:{legend:{display:false},
        tooltip:{backgroundColor:'#0c1829',borderColor:'#1e3350',borderWidth:1,
          titleColor:'#3d5a7a',bodyColor:'#a0bcd8',padding:10,titleFont:{size:12},bodyFont:{size:12},
          filter:i=>!i.dataset.label.startsWith('_'),
          callbacks:{label:c=>` ${c.dataset.label}: ${c.parsed.y.toFixed(1)}%`}}},
      scales:{
        x:{ticks:{color:'#8ab8d0',font:{size:13,family:"'Courier New',monospace"},autoSkip:false,maxRotation:0},
           grid:{color:'rgba(148,163,184,.22)',lineWidth:.5},border:{color:'#2a4a6e'}},
        y:{ticks:{color:'#8ab8d0',font:{size:13,family:"'Courier New',monospace"},callback:v=>`${v.toFixed(0)}%`},
           grid:{color:'rgba(148,163,184,.22)',lineWidth:.5},border:{color:'#2a4a6e'},
           title:{display:true,text:'Relative Error  (% of cumulative ideal distance)',
             color:'#8ab8d0',font:{size:12,family:"'Courier New',monospace"}}}
      }}
  });
}

function makeELeg(id){
  const items=[
    ['Trial range','rgba(71,85,105,.5)',null],
    ['Trial 1',COL.trialE[0],DSH[0]],
    ['Trial 2',COL.trialE[1],DSH[1]],
    ['Trial 3',COL.trialE[2],DSH[2]],
    ['Mean error','#dce8f4',[]],
  ];
  const wrap=document.getElementById(id);if(!wrap)return;
  wrap.innerHTML=items.map(([n,c,d])=>{
    const s=d!==null
      ?`width:20px;height:0;border-top:2px ${d&&d.length?'dashed':'solid'} ${c};flex-shrink:0`
      :`width:20px;height:11px;background:${c};flex-shrink:0;border-radius:2px`;
    return`<div class="ec-li"><div style="${s}"></div><span>${n}</span></div>`;
  }).join('');
}

let activeTab='circle';
function activateTab(p){
  activeTab=p;
  document.getElementById('pnl-'+p).classList.add('on');
  const eid=p==='circle'?'ec':'es';
  requestAnimationFrame(()=>makeEC(eid,p));
}
document.querySelectorAll('.tab').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab').forEach(x=>x.classList.remove('on'));
  document.querySelectorAll('.panel').forEach(x=>x.classList.remove('on'));
  b.classList.add('on');activateTab(b.dataset.p);
}));
document.getElementById('btn-replay').addEventListener('click',()=>{
  makeEC(activeTab==='circle'?'ec':'es',activeTab);
});
let rt;
window.addEventListener('resize',()=>{clearTimeout(rt);rt=setTimeout(()=>Object.values(EC).forEach(c=>c.resize()),120);});

makeELeg('ll-ec');makeELeg('ll-es');
activateTab('circle');
</script>
</body>
</html>
