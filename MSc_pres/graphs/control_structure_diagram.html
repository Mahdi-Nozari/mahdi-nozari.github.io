<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; background: transparent; }
svg { width: 100%; height: 100%; display: block; }

@keyframes dashFlow   { from { stroke-dashoffset:10; } to { stroke-dashoffset:0; } }
@keyframes techAppear { 0%{opacity:0} 38%{opacity:.7} 52%{opacity:.15} 70%{opacity:.9} 100%{opacity:1} }
@keyframes fadeIn     { from{opacity:0} to{opacity:1} }

.flow { stroke-dasharray:6 4; animation:dashFlow .9s linear infinite; fill:none; }

/* Initial state — JS drives the per-group animations */
#grp-rr, #grp-comp, #grp-arr1, #grp-hl, #grp-arr2, #grp-ll { opacity: 0; }
  @import url('https://fonts.googleapis.com/css2?family=Rubik:wght@500&display=swap');
</style>
</head>
<body>
<svg viewBox="0 0 810 290" xmlns="http://www.w3.org/2000/svg"
     preserveAspectRatio="xMidYMid meet">
<defs>
<marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
  <path d="M1,1.5 L9,5 L1,8.5 Z" fill="#00d4ff"/>
</marker>
<symbol id="chip" viewBox="0 0 32 32">
  <rect x="9" y="9" width="14" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <line x1="3"  y1="12" x2="9"  y2="12" stroke="currentColor" stroke-width="1.1"/>
  <line x1="3"  y1="16" x2="9"  y2="16" stroke="currentColor" stroke-width="1.1"/>
  <line x1="3"  y1="20" x2="9"  y2="20" stroke="currentColor" stroke-width="1.1"/>
  <line x1="23" y1="12" x2="29" y2="12" stroke="currentColor" stroke-width="1.1"/>
  <line x1="23" y1="16" x2="29" y2="16" stroke="currentColor" stroke-width="1.1"/>
  <line x1="23" y1="20" x2="29" y2="20" stroke="currentColor" stroke-width="1.1"/>
  <line x1="12" y1="3"  x2="12" y2="9"  stroke="currentColor" stroke-width="1.1"/>
  <line x1="16" y1="3"  x2="16" y2="9"  stroke="currentColor" stroke-width="1.1"/>
  <line x1="20" y1="3"  x2="20" y2="9"  stroke="currentColor" stroke-width="1.1"/>
  <line x1="12" y1="23" x2="12" y2="29" stroke="currentColor" stroke-width="1.1"/>
  <line x1="16" y1="23" x2="16" y2="29" stroke="currentColor" stroke-width="1.1"/>
  <line x1="20" y1="23" x2="20" y2="29" stroke="currentColor" stroke-width="1.1"/>
  <rect x="13" y="13" width="6" height="6" rx="1" fill="currentColor" opacity="0.25"/>
</symbol>
<symbol id="laptop" viewBox="0 0 36 28">
  <rect x="5"  y="1"  width="26" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <rect x="8"  y="4"  width="20" height="12" rx="1" fill="currentColor" opacity="0.12"/>
  <rect x="1"  y="20" width="34" height="6"  rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/>
  <rect x="13" y="20" width="10" height="3"  rx="1" fill="currentColor" opacity="0.28"/>
</symbol>
</defs>

<!-- 1 ── Rolling Robot container -->
<g id="grp-rr">
  <rect x="276" y="12" width="518" height="268" rx="12"
        fill="rgba(8,14,30,0.9)" stroke="#2c4a8a" stroke-width="1.2" stroke-dasharray="6 3"/>
  <text x="535" y="32" text-anchor="middle"
        font-family="'Rubik',sans-serif" font-size="13" font-weight="500"
        fill="#4a72b8" letter-spacing="2">ROLLING ROBOT</text>
</g>

<!-- 2 ── Computer -->
<g id="grp-comp">
  <rect x="10" y="42" width="175" height="195" rx="7"
        fill="#0d0902" stroke="#c89018" stroke-width="1.5"/>
  <text x="97" y="66" text-anchor="middle"
        font-family="'Rubik',sans-serif" font-size="14" font-weight="500"
        fill="#e8a828">Computer</text>
  <line x1="18" y1="74" x2="177" y2="74" stroke="#c89018" stroke-width="0.6" opacity="0.4"/>
  <use href="#laptop" x="79" y="106" width="36" height="28" color="#b08020"/>
  <text font-family="'Rubik',sans-serif" font-size="14" font-weight="500" fill="#907030">
    <tspan x="97" y="162" text-anchor="middle">&#x2013; Path-planning</tspan>
    <tspan x="97" dy="18"  text-anchor="middle">software</tspan>
  </text>
</g>

<!-- 3 ── Gap-1 arrows + labels -->
<g id="grp-arr1">
  <path d="M315,96 L185,96" class="flow" stroke="#00d4ff" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="250" y="88" text-anchor="middle"
        font-family="'Rubik',sans-serif" font-size="12" font-weight="500"
        fill="#50c0d8">Robot log</text>
  <path d="M185,188 L315,188" class="flow" stroke="#00d4ff" stroke-width="1.6" marker-end="url(#ah)"/>
  <text font-family="'Rubik',sans-serif" font-size="12" font-weight="500" fill="#50c0d8">
    <tspan x="250" y="201" text-anchor="middle">Movement</tspan>
    <tspan x="250" dy="14" text-anchor="middle">sequence</tspan>
  </text>
</g>

<!-- 4 ── High-level controller -->
<g id="grp-hl">
  <rect x="315" y="42" width="175" height="195" rx="7"
        fill="#020e05" stroke="#00a860" stroke-width="1.5"/>
  <text x="402" y="66" text-anchor="middle"
        font-family="'Rubik',sans-serif" font-size="14" font-weight="500"
        fill="#00d870">
    <tspan x="402">High-level</tspan>
    <tspan x="402" dy="17">controller</tspan>
  </text>
  <line x1="323" y1="87" x2="482" y2="87" stroke="#00a860" stroke-width="0.6" opacity="0.4"/>
  <text font-family="'Rubik',sans-serif" font-size="14" font-weight="500" fill="#30a060">
    <tspan x="402" y="108" text-anchor="middle">&#x2013; Robot actuation</tspan>
    <tspan x="402" dy="17" text-anchor="middle">planning</tspan>
  </text>
  <use href="#chip" x="378" y="157" width="48" height="48" color="#00a860"/>
</g>

<!-- 5 ── Gap-2 arrows + labels -->
<g id="grp-arr2">
  <path d="M580,96 L490,96" class="flow" stroke="#00d4ff" stroke-width="1.6" marker-end="url(#ah)"/>
  <text font-family="'Rubik',sans-serif" font-size="12" font-weight="500" fill="#50c0d8">
    <tspan x="535" y="76" text-anchor="middle">Sensor</tspan>
    <tspan x="535" dy="14" text-anchor="middle">feedback</tspan>
  </text>
  <path d="M490,188 L580,188" class="flow" stroke="#00d4ff" stroke-width="1.6" marker-end="url(#ah)"/>
  <text font-family="'Rubik',sans-serif" font-size="12" font-weight="500" fill="#50c0d8">
    <tspan x="535" y="201" text-anchor="middle">Actuation</tspan>
    <tspan x="535" dy="14" text-anchor="middle">commands</tspan>
  </text>
</g>

<!-- 6 ── Low-level controller -->
<g id="grp-ll">
  <rect x="580" y="42" width="175" height="195" rx="7"
        fill="#02060f" stroke="#2090ea" stroke-width="1.5"/>
  <text x="667" y="66" text-anchor="middle"
        font-family="'Rubik',sans-serif" font-size="14" font-weight="500"
        fill="#70b8ff">
    <tspan x="667">Low-level</tspan>
    <tspan x="667" dy="17">controller</tspan>
  </text>
  <line x1="588" y1="87" x2="747" y2="87" stroke="#2090ea" stroke-width="0.6" opacity="0.4"/>
  <text font-family="'Rubik',sans-serif" font-size="14" font-weight="500" fill="#5898d0">
    <tspan x="667" y="108" text-anchor="middle">&#x2013; Pressure control</tspan>
    <tspan x="667" dy="18" text-anchor="middle">&#x2013; Valve control</tspan>
    <tspan x="667" dy="18" text-anchor="middle">&#x2013; Sensor readings</tspan>
  </text>
  <use href="#chip" x="647" y="171" width="40" height="40" color="#2090ea"/>
</g>

</svg>

<script>
var SEQUENCE = [
  { id: 'grp-rr',   delay:   20550, anim: 'techAppear 0.55s both' },
  { id: 'grp-comp', delay:  6400, anim: 'techAppear 0.55s both' },
  { id: 'grp-arr1', delay:  11900, anim: 'fadeIn 0.40s both'     },
  { id: 'grp-hl',   delay: 12150, anim: 'techAppear 0.55s both' },
  { id: 'grp-arr2', delay: 17650, anim: 'fadeIn 0.40s both'     },
  { id: 'grp-ll',   delay: 17900, anim: 'techAppear 0.55s both' }
];

var timers = [];

function startAnimations() {
  // Cancel any in-progress sequence
  timers.forEach(clearTimeout);
  timers = [];

  // Reset every group to invisible with no animation
  SEQUENCE.forEach(function(item) {
    var el = document.getElementById(item.id);
    if (!el) return;
    el.style.animation = 'none';
    el.style.opacity   = '0';
  });

  // Force a reflow so the reset is committed before re-animating
  void document.body.offsetWidth;

  // Schedule each group's animation
  SEQUENCE.forEach(function(item) {
    var t = setTimeout(function() {
      var el = document.getElementById(item.id);
      if (!el) return;
      el.style.opacity   = '';
      el.style.animation = item.anim;
    }, item.delay);
    timers.push(t);
  });
}

// Run on first load
window.addEventListener('load', startAnimations);

// Re-run whenever Reveal.js navigates back to this slide.
// The parent slide calls:
//   iframe.contentWindow.postMessage('restart', '*')
window.addEventListener('message', function(e) {
  if (e.data === 'restart') startAnimations();
});
</script>
</body>
</html>
