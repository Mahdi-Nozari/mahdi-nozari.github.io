---
layout: default
---
<header class="page-heading">
  <p class="eyebrow">{{ page.eyebrow | default: 'Mahdi Nozari' }}</p>
  <h1>{{ page.title }}</h1>
  {% if page.description %}<p class="page-intro">{{ page.description }}</p>{% endif %}
</header>
<div class="page-content{% if page.wide %} page-content-wide{% else %} prose{% endif %}">
{{ content }}
</div>
